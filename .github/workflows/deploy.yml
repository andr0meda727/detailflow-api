name: Build and Push API to GHCR

on:
  push:
    branches:
      - master
    paths:
      - 'Api/**'
      - 'Core/**'
      - 'Infrastructure/**'
      - 'UnitTests/**'
      - 'IntegrationTests/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
      - 'compose.yaml'
      - 'compose.prod.yaml'
      - '.github/workflows/deploy.yml'
      - '!**/*.md'
      - '!docs/**'

concurrency:
  group: prod-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: detaileed-backend

jobs:
  # It shouldnt be neccassary to run the tests here (we have pullrequest-test workflow already), but I'm leaving it here,
  # because we dont have the branch protection (it costs $$$)

  run-tests:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Run All Tests
        run: dotnet test --configuration Release --no-restore

  build-and-push:
    name: Build and Push Docker image
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max