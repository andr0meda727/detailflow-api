name: PR Test Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - 'Api/**'
      - 'Core/**'
      - 'Infrastructure/**'
      - 'UnitTests/**'
      - 'IntegrationTests/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
      - '.github/workflows/*.yml'
      - '!**/*.md'
      - '!docs/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test "UnitTests/UnitTests.csproj" --configuration Release --logger "trx;LogFileName=unit-test-results.trx"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Integration Tests
        run: dotnet test "IntegrationTests/IntegrationTests.csproj" --configuration Release --logger "trx;LogFileName=integration-test-results.trx"