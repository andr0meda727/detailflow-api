services:
  api:
    image: ghcr.io/<your-org-or-user>/detailflow-api:${IMAGE_TAG:-latest}
    container_name: detailflow-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL